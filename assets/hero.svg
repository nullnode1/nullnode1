<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Görkem Çalışkan — GitHub profil başlığı</title>
  <desc id="desc">Hareketli yıldızlar, bir kod editörü, oyun kumandası ve Görkem Çalışkan yazılı koyu bir banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a101d"/><stop offset=".55" stop-color="#101a2b"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#71e4d2"/><stop offset="1" stop-color="#7fa8ff"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1c2c42"/><stop offset="1" stop-color="#101827"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#5acdbd" stop-opacity=".21"/><stop offset="1" stop-color="#5acdbd" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#91b3d5" stroke-opacity=".085"/></pattern>
    <clipPath id="panelClip"><rect x="706" y="71" width="419" height="278" rx="18"/></clipPath>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="19" flood-color="#020713" flood-opacity=".6"/></filter>
  </defs>
  <style>
    .orbit{transform-origin:990px 212px;animation:orbit 22s linear infinite}
    .twinkle{animation:twinkle 2.8s ease-in-out infinite alternate}
    .twinkle2{animation:twinkle 3.7s ease-in-out 1.3s infinite alternate}
    .float{animation:float 5.5s ease-in-out infinite}
    .cursor{animation:blink 1.05s steps(2,end) infinite}
    .line1{animation:appear 7s ease-in-out infinite}
    .line2{animation:appear 7s ease-in-out 1.3s infinite}
    .line3{animation:appear 7s ease-in-out 2.6s infinite}
    .pulse{animation:pulse 3.5s ease-in-out infinite}
    .travel{animation:travel 8s linear infinite}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes twinkle{from{opacity:.15}to{opacity:.75}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes appear{0%,10%{opacity:.18}21%,82%{opacity:1}95%,100%{opacity:.18}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes travel{0%{transform:translateX(-40px)}100%{transform:translateX(1200px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect x="1" y="1" width="1198" height="418" rx="24" fill="url(#bg)" stroke="#304459" stroke-opacity=".85" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="416" rx="23" fill="url(#grid)"/>
  <ellipse cx="1011" cy="187" rx="345" ry="260" fill="url(#glow)"/>
  <ellipse cx="150" cy="425" rx="300" ry="180" fill="url(#glow)" opacity=".45"/>
  <!-- Quiet animated background -->
  <g fill="#a0d6fa"><circle class="twinkle" cx="82" cy="50" r="2"/><circle class="twinkle2" cx="498" cy="45" r="2"/><circle class="twinkle" cx="645" cy="88" r="2"/><circle class="twinkle2" cx="1166" cy="56" r="2"/><circle class="twinkle" cx="650" cy="361" r="2"/><circle class="twinkle2" cx="78" cy="362" r="2"/></g>
  <path d="M0 382H1200" stroke="url(#accent)" stroke-opacity=".13" stroke-width="2"/>
  <g class="travel"><circle cx="0" cy="382" r="3" fill="#71e4d2" opacity=".8"/></g>

  <!-- Main content -->
  <g font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
    <rect x="65" y="67" width="192" height="34" rx="17" fill="#162b35" stroke="#36685f"/>
    <circle cx="83" cy="84" r="5" fill="#6fe4c4" class="pulse"/>
    <text x="99" y="90" font-size="13" fill="#a2e9dc" font-weight="600" letter-spacing=".3">HELLO, WORLD!</text>

    <text x="65" y="163" font-size="51" font-weight="700" fill="#f1f6fc" letter-spacing="-1.4">Görkem</text>
    <text x="65" y="225" font-size="51" font-weight="700" fill="url(#accent)" letter-spacing="-1.4">Çalışkan.</text>
    <rect x="65" y="244" width="51" height="4" rx="2" fill="#71e4d2"/>
    <text x="65" y="282" font-size="19" fill="#c4d2df">Oyun geliştiriyorum. Web'i keşfediyorum.</text>
    <text x="65" y="312" font-size="16" fill="#92a9be">Merakla öğreniyor, deneyerek üretiyorum.</text>

    <g font-size="13" font-weight="600">
      <rect x="65" y="341" width="111" height="35" rx="10" fill="#1d3345" stroke="#385870"/><text x="84" y="363" fill="#d6f1ee">GODOT 4</text>
      <rect x="187" y="341" width="109" height="35" rx="10" fill="#1d3345" stroke="#385870"/><text x="205" y="363" fill="#d6f1ee">GDSCRIPT</text>
      <rect x="307" y="341" width="122" height="35" rx="10" fill="#1d3345" stroke="#385870"/><text x="327" y="363" fill="#d6f1ee">PYTHON ↗</text>
    </g>
  </g>

  <!-- Decorative orbit -->
  <g class="orbit" opacity=".45">
    <path d="M990 118a94 94 0 1 1 0 188a94 94 0 1 1 0-188" fill="none" stroke="#71e4d2" stroke-dasharray="4 13" stroke-width="1.6"/>
    <circle cx="1084" cy="212" r="7" fill="#71e4d2"/>
  </g>

  <!-- Floating editor illustration -->
  <g class="float" filter="url(#shadow)">
    <rect x="704" y="69" width="423" height="282" rx="19" fill="url(#glass)" stroke="#3a546d" stroke-width="2"/>
    <path d="M704 88Q704 69 723 69H1108Q1127 69 1127 88V111H704Z" fill="#24364b"/>
    <circle cx="730" cy="90" r="5.5" fill="#ff897f"/><circle cx="749" cy="90" r="5.5" fill="#fac873"/><circle cx="768" cy="90" r="5.5" fill="#7bd6b1"/>
    <text x="898" y="95" text-anchor="middle" font-family="DejaVu Sans Mono,monospace" font-size="12" fill="#9bb4ca">main.gd</text>
    <g clip-path="url(#panelClip)" font-family="DejaVu Sans Mono,monospace" font-size="16">
      <g fill="#647e97"><text x="728" y="150">01</text><text x="728" y="183">02</text><text x="728" y="216">03</text><text x="728" y="249">04</text><text x="728" y="282">05</text></g>
      <text x="774" y="150"><tspan fill="#ae9fff">extends</tspan><tspan fill="#d7e5ed"> Node2D</tspan></text>
      <text x="774" y="183" class="line1"><tspan fill="#ae9fff">func</tspan><tspan fill="#71e4d2"> _ready</tspan><tspan fill="#d7e5ed">():</tspan></text>
      <text x="792" y="216" class="line2"><tspan fill="#71e4d2">print</tspan><tspan fill="#d7e5ed">(</tspan><tspan fill="#efc57e">"Hello, world!"</tspan><tspan fill="#d7e5ed">)</tspan></text>
      <text x="774" y="249" class="line3"><tspan fill="#7f9db3"># build · learn · repeat</tspan></text>
      <rect x="774" y="271" width="8" height="19" rx="1.5" fill="#75dfd0" class="cursor"/>
    </g>
    <rect x="704" y="320" width="423" height="31" rx="0" fill="#1d3044"/>
    <path d="M704 320H1127V332Q1127 351 1108 351H723Q704 351 704 332Z" fill="#1d3044"/>
    <circle cx="729" cy="335" r="4" fill="#7bd6b1"/><text x="740" y="340" fill="#aabed0" font-size="12" font-family="DejaVu Sans,Arial,sans-serif">ready to create</text>
  </g>
  <!-- Small game controller illustration -->
  <g transform="translate(1027 292) rotate(-10)" filter="url(#shadow)">
    <path d="M-55 5C-65 -25 -45 -43 -19 -40L28 -40C54 -43 72 -25 61 5L53 27C47 44 34 43 23 28L11 12H-4L-23 30C-36 45 -50 39 -54 24Z" fill="#d7eaf4" stroke="#6b98ad" stroke-width="3"/>
    <path d="M-36 -18V4M-47 -7H-25" stroke="#3e6479" stroke-width="6" stroke-linecap="round"/>
    <circle cx="34" cy="-14" r="5" fill="#71e4d2"/><circle cx="48" cy="-3" r="5" fill="#7fa8ff"/>
    <circle cx="-5" cy="-5" r="4" fill="#8198aa"/><circle cx="10" cy="-5" r="4" fill="#8198aa"/>
  </g>
</svg>
